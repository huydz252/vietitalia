<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Vietitalia</title>
    
    <!-- 1. Gọi trực tiếp Tailwind CDN giống hệt index.html -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- 2. Bê nguyên bộ màu sắc cấu hình sang để đồng bộ -->
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#006d34",
              primary: "#81001d",
            }
          }
        }
      }
    </script>

    <!-- 3. Link file CSS tự viết của cậu -->
    <link href="./src/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-primary">Trang Quản Trị Vietitalia</h1>
            <p class="text-gray-500 mt-2">Quản lý nội dung sự kiện và cẩm nang du lịch</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- KHU VỰC 1: QUẢN LÝ SỰ KIỆN -->
            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-primary">
                <h2 class="text-2xl font-bold mb-6 text-gray-700">🎉 Thêm Sự Kiện Mới</h2>
                
                <form id="addEventForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tên sự kiện <span class="text-red-500">*</span></label>
                        <input type="text" id="event_title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Địa điểm</label>
                            <input type="text" id="event_location" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày diễn ra</label>
                            <input type="date" id="event_date" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh Sự Kiện (Tải lên)</label>
                            <input type="file" id="event_image_file" accept="image/*" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none bg-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả chi tiết</label>
                        <textarea id="event_description" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:opacity-90 transition duration-300">
                        Lưu Sự Kiện
                    </button>
                </form>
            </div>

            <!-- KHU VỰC 2: QUẢN LÝ CẨM NANG DU LỊCH -->
            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-secondary">
                <h2 class="text-2xl font-bold mb-6 text-gray-700">✈️ Thêm Bài Du Lịch</h2>
                
                <form id="addTravelForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tiêu đề bài viết <span class="text-red-500">*</span></label>
                        <input type="text" id="travel_title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Đường dẫn tĩnh (Slug)</label>
                            <input type="text" id="travel_slug" placeholder="vd: du-lich-rome" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label>
                            <input type="text" id="travel_category" placeholder="vd: Miền Nam" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <!-- ĐÃ SỬA LẠI TÊN VÀ ID CHO ĐÚNG -->
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh Thumbnail (Tải lên)</label>
                        <input type="file" id="travel_thumbnail_file" accept="image/*" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nội dung bài viết</label>
                        <textarea id="travel_content" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-secondary focus:outline-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-secondary text-white font-bold py-3 rounded-lg hover:opacity-90 transition duration-300">
                        Lưu Bài Viết
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Script xử lý form -->
    <script type="module" src="./src/assets/js/admin.js"></script>
</body>
</html>
